name: Build and publish add-on image

# Home Assistant add-ons built from source on-device (a Pi 4, in this case)
# can OOM the Supervisor during the build. Instead we build here and publish
# a pre-built image per architecture; the Pi only ever does a `docker pull`.
# Triggered when config.yaml's version changes, so bumping the version is
# what cuts a release.
on:
  push:
    branches: [main]
    paths:
      - config.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=$(sed -nE 's/^version: *"?([^"]+)"?/\1/p' config.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push aarch64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smart_home_inventory-aarch64:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/smart_home_inventory-aarch64:latest

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smart_home_inventory-amd64:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/smart_home_inventory-amd64:latest
